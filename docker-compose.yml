version: '3.3'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: YNdDOScKSJ
      POSTGRES_DB: sitetrack_db
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sitetrack_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sitetrack-network

  nest-app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=YNdDOScKSJ
      - DATABASE_NAME=sitetrack_db
      - DATABASE_TYPE=postgres
      - DATABASE_SYNCHRONIZE=true
      - JWT_ACCESS_TOKEN_SECRET=MnJ0v8mW9Y6lNNhJHEajPf8mzsdxQZ4w
      - JWT_ACCESS_TOKEN_EXPIRES_IN=15m
      - JWT_REFRESH_TOKEN_SECRET=QZe5ExGvyEGn6X8cI8ldFNkRjZ451RPH
      - JWT_REFRESH_TOKEN_EXPIRES_IN=7d
      - PORT=3000
    networks:
      - sitetrack-network

networks:
  sitetrack-network:
    driver: bridge

volumes:
  postgres_data:
